apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist
spec:
  tls:
    - hosts:
        - prod.localhost
  rules:
    - host: prod.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist
                port:
                  number: 80
