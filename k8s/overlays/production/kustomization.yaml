apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-production
resources:
  - ../../base
  - namespace.yaml
  # SealedSecrets (gerados com kubeseal --scope strict, um por env):
  - sealed-postgres.yaml
  - sealed-auth.yaml
patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: todolist-config
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: ab710ffa3a1d6e4d4c52312443044dbaf6294681
    digest: sha256:d5421e99935289db2a33519508c7817c3c6a810fdafd75efcc3fc7bc1b2416ef
