apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-production
resources:
  - ../../base
  - namespace.yaml
  # SealedSecrets (gerados com kubeseal --scope strict, um por env):
  - sealed-postgres.yaml
  - sealed-auth.yaml
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
# configMapGenerator: hash no nome -> mudar a cor dispara rollout.
configMapGenerator:
  - name: todolist-config
    literals:
      - APP_COLOR=blue
      - APP_NAME=TodoList
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: ade914a9d074ac9663eeaa8285f5b9c602b99bfb
    digest: sha256:ccda3d9b3a5e3dba883040dbfca5baf69a480c1d9de70b200875089fd9752754
