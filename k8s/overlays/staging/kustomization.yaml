apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-staging
resources:
  - ../../base
  - namespace.yaml
  # SealedSecrets (gerados com kubeseal --scope strict, um por env):
  - sealed-postgres.yaml
  - sealed-auth.yaml
patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: todolist-config
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: d0d95f6aea96de858381e96d7367a098f629c6b3
    digest: sha256:9545990739c3754e83728a263df598be17eda5321c58690a0309005aeb5d4fac
