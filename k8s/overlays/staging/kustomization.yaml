apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-staging
resources:
  - ../../base
  - namespace.yaml
  # SealedSecrets (gerados com kubeseal --scope strict, um por env):
  - sealed-postgres.yaml
  - sealed-auth.yaml
patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: todolist-config
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: todolist
images:
  - name: ghcr.io/heitorfreitasferreira/todolist-app
    newTag: 58999487d1cfc5ef044f0efb750723b64cee2070
    digest: sha256:6f955461ca7b7ea8b768dbcfea1de89a1b6ffd1f752dac696b8fea82034639e5
