apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todolist-staging
  # SealedSecrets (gerados com kubeseal --scope strict, um por env):
resources:
- ../../base
- namespace.yaml
- sealed-postgres.yaml
- sealed-auth.yaml
patches:
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: todolist-config
- path: ingress-patch.yaml
  target:
    kind: Ingress
    name: todolist
images:
- digest: sha256:76cabe49a1dd8052209b627e6116463a40e05d7b3dad738665d2f7e6ddb0e9b3
  name: ghcr.io/heitorfreitasferreira/todolist-app
  newName: ghcr.io/heitorfreitasferreira/todolist-app
