apiVersion: v1
kind: Namespace
metadata:
  name: todolist
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todolist
  namespace: todolist
---
# /pods e o status de cleanup leem a API do Kubernetes via ServiceAccount.
# Leitura restrita a pods e cronjobs do proprio namespace (sem ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todolist-reader
  namespace: todolist
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todolist-reader
  namespace: todolist
subjects:
  - kind: ServiceAccount
    name: todolist
roleRef:
  kind: Role
  name: todolist-reader
  apiGroup: rbac.authorization.k8s.io
