apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: todolist
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: todolist
type: Opaque
stringData:
  # FORA DO PADRAO PROD: valores sinteticos para o desafio. Em producao isto
  # viria de Sealed Secrets / External Secrets, nunca em texto claro no Git.
  POSTGRES_USER: todolist
  POSTGRES_PASSWORD: CHANGEME-trocar-no-deploy-local
  POSTGRES_DB: todolist
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: todolist
spec:
  replicas: 1
  strategy:
    type: Recreate # 1 replica + 1 PVC: RollingUpdate travaria no volume
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "todolist"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: todolist
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
