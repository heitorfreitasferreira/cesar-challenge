apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 90.0.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        alertmanager:
          enabled: false # sem Alertmanager: foco em logs+metricas (ver DECISIONS)
        defaultRules:
          create: false # sem Alertmanager nao ha destino para os alertas
        prometheus:
          prometheusSpec:
            retention: 6h
            # Selecionar TODOS os ServiceMonitors do cluster (nao so os do release).
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              # SEM limits de proposito: observando uso real p/ dimensionar
              # depois (ver DECISIONS). requests mantidos p/ scheduling sao.
              requests: { cpu: 100m, memory: 512Mi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.127.0.0.1.nip.io
          additionalDataSources:
            - name: Loki
              # uid fixo: as regras de alerta referenciam "loki".
              uid: loki
              type: loki
              url: http://loki-gateway.observability.svc.cluster.local
              access: proxy
          # Alerta simples (Grafana-managed) sobre logs de erro. Sem contato de
          # notificacao: o ambiente e local e descartavel (ver DECISIONS).
          alerting:
            rules.yaml:
              apiVersion: 1
              groups:
                - orgId: 1
                  name: todolist-logs
                  folder: TodoList
                  interval: 1m
                  rules:
                    - uid: todolist-erros-logs
                      title: TodoList - logs de erro em staging/production
                      condition: B
                      for: 5m
                      noDataState: OK
                      execErrState: OK
                      labels:
                        severity: warning
                      annotations:
                        summary: Logs de nivel error/critical acima do limiar em 5 minutos
                      data:
                        - refId: A
                          datasourceUid: loki
                          relativeTimeRange: { from: 300, to: 0 }
                          model:
                            editorMode: code
                            queryType: range
                            refId: A
                            expr: 'sum(count_over_time({namespace=~"todolist-.*"} | level=~"(?i)(error|critical)" [5m]))'
                        - refId: B
                          datasourceUid: __expr__
                          relativeTimeRange: { from: 300, to: 0 }
                          model:
                            refId: B
                            type: reduce
                            expression: A
                            reducer: last
                            settings: { mode: "" }
                        - refId: C
                          datasourceUid: __expr__
                          relativeTimeRange: { from: 300, to: 0 }
                          model:
                            refId: C
                            type: math
                            expression: "$B > 0"
                            settings: {}
          resources:
            # SEM limits de proposito: observando uso real (ver DECISIONS).
            requests: { cpu: 50m, memory: 256Mi }
        prometheusOperator:
          resources:
            requests: { cpu: 50m, memory: 128Mi }
        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
